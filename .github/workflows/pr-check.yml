name: pr-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install
        run: npm ci

      - name: Check
        run: npm run verify

      - name: Rust
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/i18n/lib
            .cache/i18n/model-cache
          key: i18n-small100-a0d8498-ort-1.22.0-linux-x64

      - name: Setup i18n
        run: |
          rustup override set 1.100.0
          if [[ ! -f i18n/Cargo.lock ]]; then
            cargo generate-lockfile --manifest-path i18n/Cargo.toml
          fi
          cargo test --locked --manifest-path i18n/Cargo.toml --target-dir .cache/i18n-target
          bash scripts/build-i18n.sh

      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
