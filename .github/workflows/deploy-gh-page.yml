name: deploy-gh-page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  binary-check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      key: ${{ steps.check.outputs.key }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check bin release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          key="$(bash scripts/i18n-key.sh)"
          tag="binary-$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

          exists=true
          if assets="$(gh release view "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.size > 0) | .name')"; then
            for platform in linux-x64 linux-arm64; do
              asset="gh-profile-i18n-$platform.tar.gz"
              for file in "$asset" "$asset.sha256"; do
                if ! grep -Fxq "$file" <<< "$assets"; then
                  exists=false
                fi
              done
            done
          else
            exists=false
          fi

          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "Compatible binary release exists: $exists"
  binary:
    needs: binary-check
    if: needs.binary-check.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy

      - name: Cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/i18n/lib
            .cache/i18n/model-cache
          key: i18n-small100-a0d8498-ort-1.31.1-${{ matrix.platform }}

      - name: Bundle
        shell: bash
        run: |
          rustup override set 1.100.0
          cargo fmt --manifest-path i18n/Cargo.toml --all -- --check
          cargo clippy --manifest-path i18n/Cargo.toml --locked --all-targets --all-features --target-dir .cache/i18n-target -- -D warnings
          cargo test --locked --manifest-path i18n/Cargo.toml --target-dir .cache/i18n-target
          bash scripts/build-i18n.sh
          if [[ "$(cat .cache/i18n/SOURCE_HASH)" != "$SOURCE_KEY" ]]; then
            echo '::error::Bundle source hash differs from preflight source hash.' >&2
            exit 1
          fi
          asset="gh-profile-i18n-${{ matrix.platform }}.tar.gz"
          tar -czf "$asset" -C .cache/i18n gh-profile-i18n run-i18n SOURCE_HASH lib model-cache
          sha256sum "$asset" > "$asset.sha256"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SOURCE_KEY: ${{ needs.binary-check.outputs.key }}

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: i18n-${{ matrix.platform }}
          path: |
            gh-profile-i18n-*.tar.gz
            gh-profile-i18n-*.tar.gz.sha256
          compression-level: 0
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [binary-check, binary]
    if: needs.binary-check.outputs.exists != 'true'
    permissions:
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v7
        with:
          pattern: i18n-*
          merge-multiple: true

      - name: Release
        shell: bash
        run: |
          tag="binary-$SOURCE_KEY"
          assets=()
          for platform in linux-x64 linux-arm64; do
            asset="gh-profile-i18n-$platform.tar.gz"
            test -s "$asset"
            test -s "$asset.sha256"
            sha256sum --check --strict "$asset.sha256"
            assets+=("$asset" "$asset.sha256")
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" \
              --notes "Localization binaries for $SOURCE_KEY" --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ needs.binary-check.outputs.key }}

  build:
    needs: [binary-check, release]
    if: >-
      !cancelled() &&
      needs.binary-check.result == 'success' &&
      (needs.binary-check.outputs.exists == 'true' || needs.release.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run verify:web

      - name: Setup i18n
        env:
          SOURCE_KEY: ${{ needs.binary-check.outputs.key }}
        run: bash scripts/setup-bin.sh "$GITHUB_REPOSITORY" "$SOURCE_KEY"
      - name: i18n
        run: npm run i18n
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build
        run: npm exec -- astro build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
