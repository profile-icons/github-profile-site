name: "GitHub Profile Site"
description: "Deploy a configurable GitHub profile site with avatar, & optional tagline, translations, themes, & icon links."
author: "profile-icons"

branding:
  icon: "user"
  color: "blue"

inputs:
  config-path:
    description: "Path to the `site.config.json` file"
    required: false
    default: "site.config.json"

outputs:
  dist-path:
    description: "Path to the generated Astro.js site"
    value: ${{ steps.build.outputs.dist-path }}

runs:
  using: "composite"
  steps:
    - name: Init
      shell: bash
      run: |
        BUILD_DIR="$RUNNER_TEMP/github-profile-site"
        CONFIG_PATH="${{ github.workspace }}/${{ inputs.config-path }}"

        if [[ ! -f "$CONFIG_PATH" ]]; then
          echo "::error::Config file not found: $CONFIG_PATH"
          exit 1
        fi

        rm -rf "$BUILD_DIR"
        mkdir -p "$BUILD_DIR"

        cp -R "$GITHUB_ACTION_PATH/." "$BUILD_DIR/"
        cp "$CONFIG_PATH" "$BUILD_DIR/site.config.json"

    - name: Setup
      uses: actions/setup-node@v7
      with:
        node-version: 26
        package-manager-cache: false

    - name: Install
      shell: bash
      working-directory: ${{ runner.temp }}/github-profile-site
      run: npm ci

    - name: Setup i18n
      shell: bash
      working-directory: ${{ runner.temp }}/github-profile-site
      run: |
        if [[ -e "$GITHUB_ACTION_PATH/.git" ]]; then
          sha="$(git -C "$GITHUB_ACTION_PATH" rev-parse HEAD)"
          repo="${ACTION_REPOSITORY:-$GITHUB_REPOSITORY}"
        else
          repo="${ACTION_REPOSITORY:?GitHub Action repository is required}"
          ref="${ACTION_REF:?GitHub Action ref is required}"
          sha="$(gh api "repos/$repo/commits/$(jq -rn --arg ref "$ref" '$ref|@uri')" --jq .sha)"
        fi
        bash scripts/setup-bin.sh "$repo" "$sha"
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        ACTION_REF: ${{ github.action_ref }}
        GH_TOKEN: ${{ github.token }}

    - name: i18n
      shell: bash
      working-directory: ${{ runner.temp }}/github-profile-site
      run: npm run i18n
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Build
      id: build
      shell: bash
      working-directory: ${{ runner.temp }}/github-profile-site
      run: |
        npm exec -- astro build
        echo "dist-path=$RUNNER_TEMP/github-profile-site/dist" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ github.token }}
